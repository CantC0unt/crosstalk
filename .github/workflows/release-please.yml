name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  publish:
    name: Publish released package to PyPI
    if: ${{ needs.release-please.outputs.release_created }}
    needs: release-please
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/crosstalk-mcp-server
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        run: |
          tag_version="${{ needs.release-please.outputs.tag_name }}"
          tag_version="${tag_version#v}"
          package_version="$(tr -d '[:space:]' < VERSION)"
          test "$tag_version" = "$package_version"

      - name: Run tests
        run: python -m unittest tests/test_main.py

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
