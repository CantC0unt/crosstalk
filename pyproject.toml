[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crosstalk-mcp-server"
dynamic = ["version"]
description = "A dependency-free MCP server for AI-context group messaging"
readme = {file = "README", content-type = "text/markdown"}
license = {file = "LICENSE"}
authors = [
  {name = "Vaibhav Verma"},
]
keywords = [
  "mcp",
  "model-context-protocol",
  "ai",
  "agents",
  "messaging",
  "crosstalk",
  "context-sharing",
  "ai-conversation",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.9"

[project.scripts]
crosstalk-mcp = "main:serve"

[project.urls]
Homepage = "https://github.com/CantC0unt/crosstalk"
Source = "https://github.com/CantC0unt/crosstalk"
Issues = "https://github.com/CantC0unt/crosstalk/issues"

[tool.setuptools]
py-modules = ["main"]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}
